name: Spec validation

# Validate the AMP spec on every PR + push to main. Four independent jobs run
# in parallel so a failure in one (e.g. lockstep drift) doesn't block visibility
# into others (e.g. compliance regressions).
#
# Jobs:
#   1. openapi-lint     — redocly lint on schema/amp-openapi.yaml. Catches
#                         OpenAPI 3.0 structural bugs, broken $refs, missing
#                         required fields, etc.
#   2. schema-lockstep  — scripts/check_schema_lockstep.py. Compares the
#                         JSON-Schema (MCP channel) against the OpenAPI (REST
#                         channel) and fails on cross-channel drift.
#   3. schemathesis     — schemathesis run against a prism mock generated from
#                         the OpenAPI. Property-based testing catches schema
#                         internal inconsistencies (response shapes, enums,
#                         input-validation surface).
#   4. compliance-suite — the existing hand-written 154-test pytest suite
#                         (compliance/test_amp_server.py) against the
#                         reference server. Encodes behavioural MUSTs (RFC
#                         7396 merge-patch, cross-scope not_found discipline,
#                         transactional rollback, etc.) that no auto-generated
#                         tooling can express.
#
# Triggered on every PR to main and every push to main. Required statuses
# (configured in branch protection) gate merges.

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-lint:
    name: OpenAPI 3.0 lint (redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install redocly
        run: npm install -g @redocly/cli@latest

      - name: Lint schema/amp-openapi.yaml
        run: redocly lint schema/amp-openapi.yaml

  schema-lockstep:
    name: Schema lockstep (amp.json ↔ amp-openapi.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run lockstep checker
        run: python scripts/check_schema_lockstep.py

  schemathesis:
    name: Schemathesis property-based testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for prism)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (for schemathesis)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install prism + schemathesis
        run: |
          npm install -g @stoplight/prism-cli
          pip install 'schemathesis>=3.36'

      - name: Start prism mock server
        run: |
          # Use --dynamic so prism generates spec-compliant random responses
          # rather than echoing the first example. -p 4010 is the schemathesis
          # default endpoint.
          prism mock --dynamic --port 4010 schema/amp-openapi.yaml > prism.log 2>&1 &
          # Wait for prism to come up; bail out after 30s.
          for i in {1..30}; do
            if curl -sf http://localhost:4010 > /dev/null 2>&1 || \
               curl -sf -X POST http://localhost:4010/v1/memories/stats?agent_id=a 2>&1 | grep -q .; then
              echo "prism ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run schemathesis against the mock
        run: |
          # Property-based fuzzer for OpenAPI. With prism as the target, this
          # validates the OpenAPI document's INTERNAL CONSISTENCY (response
          # schemas match what the spec says generated requests should produce)
          # rather than checking a real implementation. That's the right test
          # for "is the spec self-consistent". The implementation test lives in
          # the compliance-suite job below.
          #
          # --checks: all built-in checks (status code conformance, response
          # schema conformance, server errors, content type, headers).
          # --max-examples: per-endpoint hypothesis budget; 25 is enough to
          # catch structural bugs without ballooning CI time.
          schemathesis run \
            --base-url http://localhost:4010 \
            --checks all \
            --max-examples 25 \
            --hypothesis-deadline 5000 \
            schema/amp-openapi.yaml \
          || (echo "::group::prism log"; cat prism.log; echo "::endgroup::"; exit 1)

  compliance-suite:
    name: AMP compliance suite (154 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference server (editable)
        working-directory: python/amp-server
        run: |
          pip install -e .
          pip install pytest

      - name: Run compliance suite
        run: |
          # The suite is parameterised on the server command — it spawns one
          # subprocess per test fixture and speaks MCP/stdio. Reference server
          # is amp-server (from the editable install above).
          pytest compliance/test_amp_server.py \
            --server-cmd "$(which amp-server)" \
            -q --tb=short
