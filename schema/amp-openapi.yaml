openapi: 3.0.0
info:
  title: Agent Memory Protocol (AMP) v1.1 REST API Specification
  description: |
    Standard RESTful service contract for the Agent Memory Protocol (AMP) v1.1.
    This specification enables application harnesses to integrate with memory backends
    as a robust service layer, independent of the Model Context Protocol (MCP) transport.

    Error model: every non-2xx response body conforms to `ErrorResponse`
    (`amp_error_code` + `message`). Per spec §3.4, the field name and enum match
    the JSON Schema `AmpErrorData` definition exactly so the two channels share
    one wire shape. HTTP status mapping:

    | amp_error_code   | HTTP status |
    |------------------|-------------|
    | invalid_request  | 400         |
    | not_found        | 404         |
    | not_supported    | 501         |
    | backend_error    | 500         |
  version: 1.1.0
servers:
  - url: http://localhost:8000
    description: Local development memory backend server
paths:
  /v1/memories:
    post:
      summary: Encode a new memory (amp.encode)
      description: |
        Ingest a new memory for a given logical agent, scoped to a specific user,
        session, application surface, or organization if applicable. The backend
        evaluates the salience of the memory unless `force` is set to `true`.
        Asynchronous backends may queue this extraction and return `status: queued`.
      operationId: encodeMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncodeRequest'
      responses:
        '200':
          description: Ingestion processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        '400':
          description: Invalid request (missing required fields, invalid scope, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend does not support this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/recall:
    post:
      summary: Recall memories (amp.recall)
      description: Retrieve active or pinned memories relevant to a query.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Retrieved matching memories ranked by relevance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '400':
          description: Invalid request (missing query, invalid scope, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/{id}:
    delete:
      summary: Forget a memory (amp.forget)
      description: |
        Permanently delete a memory from the store, cascading to all index
        models and graphs.

        Scope is passed as a JSON body (DELETE-with-body is valid per
        RFC 9110 §9.3.5 and is required here because the v1.1 multi-dimensional
        Scope object does not fit cleanly into a flat query string and must
        match the MCP channel's structured shape byte-for-byte).
      operationId: forgetMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeEnvelope'
      responses:
        '200':
          description: Deletion request outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [forgotten]
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Memory not found under the active scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/{id}/pin:
    put:
      summary: Pin a memory (amp.pin)
      description: |
        Mark a memory as permanent so that background consolidation will never
        archive it. Full-conformance only -- core backends MUST respond 501.
      operationId: pinMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeEnvelope'
      responses:
        '200':
          description: Pin request outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [pinned]
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Memory not found under the active scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Pinning not supported by backend (core conformance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/consolidate:
    post:
      summary: Consolidate memory (amp.consolidate)
      description: |
        Trigger background consolidation, summarizing, decaying, and archiving memories.
        This is a harness-only system API and should be scheduled out-of-band by cron loops.
        Full-conformance only -- core backends MUST respond 501.
      operationId: consolidateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidateRequest'
      responses:
        '200':
          description: Consolidation triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateResponse'
        '400':
          description: Invalid request (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Consolidation not supported by backend (core conformance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/stats:
    get:
      summary: Retrieve statistics (amp.stats)
      description: |
        Fetch metrics, record counts, and engine states for a specific namespace.

        Scope is transported as discrete query parameters on the GET channel
        (no request body). Per spec §2.3 at least one isolating identity key
        (`agent_id`, `group_id`, `workspace_id`, or `user_id`) MUST be present
        in the query string; otherwise the server MUST respond 400.
      operationId: statsMemory
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: session_id
          in: query
          required: false
          schema:
            type: string
        - name: app_id
          in: query
          required: false
          schema:
            type: string
        - name: org_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Statistics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/export:
    post:
      summary: Bulk export memories as MXF (amp.export)
      description: |
        Stream all memories matching the scope and filters as a Memory Exchange Format
        (NDJSON) document. Each line is a `MemoryResult`. Intended for backup, migration,
        and cross-vendor portability. See spec Appendix A.

        Harness-only system API. SHOULD NOT be exposed to the LLM through the MCP adapter
        unless the host explicitly intends to grant agents bulk-read access.
      operationId: exportMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: |
            NDJSON stream of MemoryResult rows (one per line).
            If pagination is in effect (caller supplied page_size or backend chose to
            chunk), the response MUST include an `X-AMP-Next-Cursor` header. The caller
            then issues a follow-up POST with `cursor` set to that value to retrieve the
            next page.
          headers:
            X-AMP-Next-Cursor:
              description: |
                Opaque continuation token. Present when more rows remain.
                When absent, the export is complete.
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                description: NDJSON (MXF). Each line is a `MemoryResult` JSON object.
        '400':
          description: Invalid scope or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scope partition does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend does not support bulk export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/import:
    post:
      summary: Bulk import memories from MXF (amp.import)
      description: |
        Ingest a Memory Exchange Format (NDJSON) document into the backend under the
        given scope. Each input line must be a `MemoryResult` row. Conflicts on existing
        `id` are handled per `on_conflict` (skip | overwrite | fail_atomic | fail_fast).
        See spec Appendix A and spec §3.3.5.

        Harness-only system API. SHOULD NOT be exposed to the LLM through the MCP adapter.
      operationId: importMemories
      parameters:
        - name: on_conflict
          in: query
          required: false
          description: |
            Policy controlling what happens when a row cannot be cleanly imported.
            For `skip` and `overwrite` the trigger is specifically an id collision;
            for `fail_atomic` and `fail_fast` the trigger is ANY row-level failure
            (id collision, malformed JSON, schema validation failure, or scope
            violation).
            - `skip` (default): on id collision, keep existing, count toward `skipped`
              (idempotent re-import)
            - `overwrite`: on id collision, replace existing with incoming row
            - `fail_atomic`: abort and roll back the entire import on first row-level
              failure (backends without transaction support MUST return 501
              `not_supported`)
            - `fail_fast`: abort on first row-level failure but DO NOT roll back
              already-imported rows; caller resumes via id-keyed diff
          schema:
            type: string
            enum: [skip, overwrite, fail_atomic, fail_fast]
            default: skip
        - name: scope_remap
          in: query
          required: false
          description: |
            Policy when an imported row's own scope omits an identity key present in the
            request scope. `strict` (default) counts the row as failed
            (amp_error_code=invalid_request); `inherit` fills missing identity keys from
            the request scope. Callers MUST opt into `inherit` — it changes data ownership.
            Rows whose scope CONFLICTS with the request scope are always failed regardless
            of this policy.
          schema:
            type: string
            enum: [strict, inherit]
            default: strict
        - name: agent_id
          in: query
          required: false
          description: Optional flat scope identifier (mapped to scope.agent_id).
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: org_id
          in: query
          required: false
          description: Optional scope identifier (mapped to scope.org_id).
          schema:
            type: string
        - name: session_id
          in: query
          required: false
          description: Optional scope identifier (mapped to scope.session_id).
          schema:
            type: string
        - name: app_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: NDJSON document (MXF). One `MemoryResult` per line.
      responses:
        '200':
          description: |
            Import completed (synchronously or accepted for async processing). This
            status is returned for both fully successful imports and partial-success
            imports — row-level failures (malformed JSON lines, schema-invalid rows,
            scope violations under `scope_remap=strict`) are reported in
            `ImportResponse.failed` and `ImportResponse.errors`, not as HTTP 400.
            See spec §3.3.5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: |
            Request-level error only: the request body is unparseable or empty, the
            top-level `scope` field is missing/invalid, or a query parameter is
            malformed. Per-line NDJSON failures do NOT use this status — they are
            counted in `ImportResponse.failed`/`errors` with a `200` response. See
            spec §3.3.5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend does not support bulk import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Scope:
      type: object
      description: |
        Multi-dimensional partition keys (spec §2.3). At least one isolating
        identity key (`agent_id`, `group_id`, `workspace_id`, or `user_id`)
        MUST be set. The remaining keys (`session_id`, `app_id`, `org_id`)
        refine the namespace but do NOT satisfy the at-least-one-isolating-key
        requirement on their own.
      minProperties: 1
      properties:
        agent_id:
          type: string
          description: Logical identity of the agent.
        group_id:
          type: string
          description: Collaborative group or team identifier.
        workspace_id:
          type: string
          description: Shared workspace identifier.
        user_id:
          type: string
          description: End-user interacting with the agent.
        session_id:
          type: string
          description: Specific conversation turn, flow, or run (alias - run_id).
        app_id:
          type: string
          description: Product surface, app instance, or platform.
        org_id:
          type: string
          description: Tenant partition.
      anyOf:
        - required: [agent_id]
        - required: [group_id]
        - required: [workspace_id]
        - required: [user_id]

    ScopeEnvelope:
      description: |
        Request body shape carrying a `scope` object (preferred) or a legacy
        flat `agent_id` (for v1.0-compat callers). Used by REST endpoints
        whose only payload is the scope -- DELETE /v1/memories/{id} and
        PUT /v1/memories/{id}/pin.
      type: object
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy v1.0 flat identifier (mapped to scope.agent_id).

    MemoryResult:
      type: object
      required:
        - id
        - content
        - score
        - timestamp
        - status
        - scope
      properties:
        id:
          type: string
        content:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, pinned, archived]
        scope:
          $ref: '#/components/schemas/Scope'
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated in favor of multi-dimensional scoping in v1.1.
        metadata:
          type: object
          properties:
            amp.ttl:
              type: integer
            amp.confidence:
              type: number
              format: float
            amp.entities:
              type: array
              items:
                type: string
            amp.relations:
              type: array
              items:
                type: object
            amp.categories:
              type: array
              items:
                type: string
            amp.summary:
              type: string
          additionalProperties: true

    EncodeRequest:
      type: object
      required:
        - content
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        content:
          type: string
        source:
          type: string
        force:
          type: boolean
          default: false
        private:
          type: boolean
          default: false
          deprecated: true
          description: Deprecated in favor of multi-dimensional scoping.
        metadata:
          type: object
          additionalProperties: true

    EncodeResponse:
      type: object
      required:
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum: [stored, duplicate, below_threshold, queued]
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated. Echoed only when the legacy `private` param was supplied.
        event_id:
          type: string
          description: |
            Async processing reference. SHOULD be present when `status` is `queued`
            so callers can poll or subscribe to the eventual outcome.

    RecallRequest:
      type: object
      required:
        - query
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        query:
          type: string
        top_k:
          type: integer
          default: 10
        filters:
          $ref: '#/components/schemas/RecallFilters'

    RecallFilters:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, pinned, archived]
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated. Filter by visibility.
        source:
          type: string
        timestamp_after:
          type: string
          format: date-time
        timestamp_before:
          type: string
          format: date-time

    RecallResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResult'

    ConsolidateRequest:
      type: object
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        depth:
          type: string
          enum: [full, light]
          default: full

    ConsolidateResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [queued, ok, not_supported]
        memories_processed:
          type: integer

    StatsResponse:
      type: object
      required:
        - memory_count
      properties:
        memory_count:
          type: integer
        unconsolidated_count:
          type: integer
        metadata:
          type: object
          additionalProperties: true

    ErrorResponse:
      description: |
        Wire-compatible alias of the JSON Schema `AmpErrorData` definition
        (schema/amp.json). The field name `amp_error_code` matches the MCP
        channel exactly so the two channels share one error shape.
      type: object
      required:
        - amp_error_code
        - message
      properties:
        amp_error_code:
          type: string
          enum: [invalid_request, not_found, not_supported, backend_error]
        message:
          type: string

    ExportRequest:
      type: object
      description: Bulk export request. Scope and (optional) filters define which rows are emitted. Use `page_size` and `cursor` for pagination.
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat partition identifier (mapped to scope.agent_id).
        filters:
          type: object
          description: Same shape as RecallFilters — status, source, timestamp_after, timestamp_before.
          additionalProperties: true
        page_size:
          type: integer
          minimum: 1
          description: |
            Hint for the maximum number of rows in this page. Backends MAY emit fewer rows
            under memory pressure but MUST NOT exceed the hint. If absent, the backend
            applies its own cap and uses `X-AMP-Next-Cursor` for continuation.
        cursor:
          type: string
          description: |
            Opaque continuation token returned by the prior page's `X-AMP-Next-Cursor`
            header. When omitted, the export starts from the beginning of the
            deterministic order.

    ImportResponse:
      type: object
      required:
        - imported
        - skipped
        - failed
      properties:
        imported:
          type: integer
          minimum: 0
          description: Rows successfully stored as new or overwritten.
        skipped:
          type: integer
          minimum: 0
          description: Rows skipped due to existing id conflict (only when on_conflict=skip).
        failed:
          type: integer
          minimum: 0
          description: Rows that failed validation or could not be stored.
        errors:
          type: array
          description: Bounded list of per-row failures. Backends MAY truncate.
          items:
            type: object
            required: [line, amp_error_code, message]
            properties:
              line:
                type: integer
                minimum: 1
              amp_error_code:
                type: string
                enum: [invalid_request, backend_error]
              message:
                type: string
        event_id:
          type: string
          description: Optional async processing reference if the backend executes the import asynchronously.
