openapi: 3.0.0
info:
  title: Agent Memory Protocol (AMP) v1.2-draft REST API Specification
  description: |
    Standard RESTful service contract for the Agent Memory Protocol (AMP).
    Tracks spec/amp-v1.1.md, which is currently at **v1.2-draft** (extends v1.1
    with `amp.update`, `amp.batch_encode`, structured `metadata_filters`, and
    the recall-hardening / metadata-bag-cap rules).

    This specification enables application harnesses to integrate with memory
    backends as a robust service layer, independent of the Model Context
    Protocol (MCP) transport.

    Error model: every non-2xx response body conforms to `ErrorResponse`
    (`amp_error_code` + `message`). Per spec §3.5, the field name and enum match
    the JSON Schema `AmpErrorData` definition exactly so the two channels share
    one wire shape. HTTP status mapping:

    | amp_error_code   | HTTP status |
    |------------------|-------------|
    | invalid_request  | 400         |
    | not_found        | 404         |
    | not_supported    | 501         |
    | backend_error    | 500         |

    **Existence-leak discipline.** `amp.forget`, `amp.pin`, and `amp.update`
    return their `not_found` outcome as a **200 response with `status:
    "not_found"`** rather than HTTP 404. This is deliberate: it matches the
    MCP channel byte-for-byte (JSON-RPC has no HTTP status), and it prevents
    cross-scope existence leaks. A scope-A caller passing a scope-B id MUST
    see the same response shape as if the id never existed in any scope.
  version: 1.2.0-draft
servers:
  - url: http://localhost:8000
    description: Local development memory backend server
paths:
  /v1/memories:
    post:
      summary: Encode a new memory (amp.encode)
      description: |
        Ingest a new memory for a given logical agent, scoped to a specific user,
        session, application surface, or organization if applicable. The backend
        evaluates the salience of the memory unless `force` is set to `true`.
        Asynchronous backends may queue this extraction and return `status: queued`.
      operationId: encodeMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncodeRequest'
      responses:
        '200':
          description: Ingestion processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        '400':
          description: Invalid request (missing required fields, invalid scope, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend does not support this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/recall:
    post:
      summary: Recall memories (amp.recall)
      description: Retrieve active or pinned memories relevant to a query.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Retrieved matching memories ranked by relevance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '400':
          description: Invalid request (missing query, invalid scope, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/{id}:
    delete:
      summary: Forget a memory (amp.forget)
      description: |
        Permanently delete a memory from the store, cascading to all index
        models and graphs.

        Scope is passed as a JSON body (DELETE-with-body is valid per
        RFC 9110 §9.3.5 and is required here because the v1.1 multi-dimensional
        Scope object does not fit cleanly into a flat query string and must
        match the MCP channel's structured shape byte-for-byte).
      operationId: forgetMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeEnvelope'
      responses:
        '200':
          description: |
            Deletion request outcome. **`not_found` is returned here, not via
            HTTP 404**, to match the MCP channel and to avoid leaking
            cross-scope existence information (a scope-A caller passing a
            scope-B id sees the same 200 + `{status: "not_found"}` as if the
            id never existed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgetResponse'
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update a memory in place (amp.update) — v1.2-draft
      description: |
        Mutate the `content` and/or `metadata` of an existing memory without
        changing its `id`, `scope`, `source`, `status`, or `creation_time`.
        Closes the v1.1 gap where a fact correction or confidence-recomputation
        forced callers to `forget` + `encode` and lose the original `id` and
        any graph edges that referenced it.

        **Metadata semantics.** By default `metadata` applies as RFC 7396 JSON
        Merge Patch — keys present in the request are written, keys absent are
        preserved, and `null` in the patch removes the corresponding key. Set
        `metadata_mode: "replace"` to overwrite the bag wholesale.

        **No-op detection.** A request that produces no observable change
        (both `content` and `metadata` omitted, or a merge that yields a
        byte-identical bag) returns `status: "no_change"` rather than
        `"updated"`.

        **Cross-scope id → 200 `not_found`** (existence-leak discipline). See
        the response 200 description.

        **Transactional durability.** If the durable write fails after the
        in-memory mutation, the response is `backend_error` AND the in-memory
        state is rolled back to the pre-update snapshot.

        See spec §3.2.4. Introduced in v1.2-draft. v1.1 backends MAY respond
        501 (`not_supported`).
      operationId: updateMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description: |
            Update outcome. `not_found` is returned here (not via HTTP 404) to
            match the MCP channel and to avoid cross-scope existence leaks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '400':
          description: |
            Invalid request (missing isolating identity key, empty `content`
            explicitly supplied, invalid `metadata_mode`, oversized metadata
            bag).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal backend error. If the durable write failed after the
            in-memory mutation, the backend MUST have rolled back the mutation
            before returning this status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: |
            Backend does not implement amp.update. v1.1-conformant backends
            MAY return this status for the entire endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/batch_encode:
    post:
      summary: Encode multiple memories in one round-trip (amp.batch_encode) — v1.2-draft
      description: |
        Store multiple memories in a single network round-trip under one shared
        top-level `scope`. Entries do NOT carry their own scope — all rows in a
        single call land under the request `scope`. Callers needing multi-scope
        bulk writes issue one `batch_encode` call per scope (or fall back to
        `amp.import` for true cross-scope migration).

        **Per-row strictness.** Backends MUST treat the following as row-level
        `invalid_request` (so the surrounding batch keeps going):
        - Unknown / forbidden keys on an entry (anything outside `content`,
          `source`, `force`, `metadata`). Notably `scope`, `agent_id`, and the
          deprecated `private` field MUST NOT be silently dropped.
        - `force` not strictly a JSON boolean.
        - `source` present but not in the published `MemorySource` enum.
        - `metadata` exceeding the 64 KiB serialized JSON cap.

        **Ordering.** `results[]` MUST appear in the same order as the input
        `entries[]`, with `len(results) == len(entries)`.

        **Durable-save honesty.** If a backend defers durable writes and the
        end-of-batch save fails, every row whose durability depended on it
        MUST be downgraded from `stored` to `backend_error` in `results[]`
        AND the `summary` counters MUST reflect the downgrade.

        **Size limit.** The schema caps `entries.maxItems` at 1000. Backends
        MAY enforce a lower cap and MUST reject over-limit requests with
        `invalid_request`.

        See spec §3.2.5. Introduced in v1.2-draft. v1.1 backends MAY respond
        501 (`not_supported`).
      operationId: batchEncodeMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchEncodeRequest'
      responses:
        '200':
          description: |
            Batch processed (synchronously or accepted for async processing).
            Row-level failures live in `results[i].status` and do NOT cause
            the request itself to fail with HTTP 400 — only request-level
            problems do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEncodeResponse'
        '400':
          description: |
            Request-level error: missing/invalid `scope`, `entries` not an
            array, batch over the backend's `maxItems` cap. Per-row failures
            are NOT returned at this status — they are reported in
            `BatchEncodeResponse.results[i]`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: |
            Backend does not implement amp.batch_encode. v1.1-conformant
            backends MAY return this status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/{id}/pin:
    put:
      summary: Pin a memory (amp.pin)
      description: |
        Mark a memory as permanent so that background consolidation will never
        archive it. Full-conformance only -- core backends MUST respond 501.
      operationId: pinMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeEnvelope'
      responses:
        '200':
          description: |
            Pin request outcome. `not_found` is returned here (not via HTTP
            404) to match the MCP channel and avoid cross-scope existence
            leaks. `not_supported` is also returned as a 200 body status when
            the backend simply doesn't implement pinning; legacy backends MAY
            still respond 501 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinResponse'
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Pinning not supported by backend (core conformance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/consolidate:
    post:
      summary: Consolidate memory (amp.consolidate)
      description: |
        Trigger background consolidation, summarizing, decaying, and archiving memories.
        This is a harness-only system API and should be scheduled out-of-band by cron loops.
        Full-conformance only -- core backends MUST respond 501.
      operationId: consolidateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidateRequest'
      responses:
        '200':
          description: Consolidation triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateResponse'
        '400':
          description: Invalid request (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Consolidation not supported by backend (core conformance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/stats:
    get:
      summary: Retrieve statistics (amp.stats)
      description: |
        Fetch metrics, record counts, and engine states for a specific namespace.

        Scope is transported as discrete query parameters on the GET channel
        (no request body). Per spec §2.3 at least one isolating identity key
        (`agent_id`, `group_id`, `workspace_id`, or `user_id`) MUST be present
        in the query string; otherwise the server MUST respond 400.
      operationId: statsMemory
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: session_id
          in: query
          required: false
          schema:
            type: string
        - name: app_id
          in: query
          required: false
          schema:
            type: string
        - name: org_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Statistics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '400':
          description: Invalid scope (e.g. missing isolating identity key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/export:
    post:
      summary: Bulk export memories as MXF (amp.export)
      description: |
        Stream all memories matching the scope and filters as a Memory Exchange Format
        (NDJSON) document. Each line is a `MemoryResult`. Intended for backup, migration,
        and cross-vendor portability. See spec Appendix A.

        Harness-only system API. SHOULD NOT be exposed to the LLM through the MCP adapter
        unless the host explicitly intends to grant agents bulk-read access.
      operationId: exportMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: |
            NDJSON stream of MemoryResult rows (one per line).
            If pagination is in effect (caller supplied page_size or backend chose to
            chunk), the response MUST include an `X-AMP-Next-Cursor` header. The caller
            then issues a follow-up POST with `cursor` set to that value to retrieve the
            next page.
          headers:
            X-AMP-Next-Cursor:
              description: |
                Opaque continuation token. Present when more rows remain.
                When absent, the export is complete.
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          description: Invalid scope or filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Backend does not support bulk export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/import:
    post:
      summary: Bulk import memories from MXF (amp.import)
      description: |
        Ingest a Memory Exchange Format (NDJSON) document into the backend under the
        given scope. The request body is a single JSON object (`ImportRequest`) carrying
        the structured `scope`, the inline `ndjson` document, and the `on_conflict` /
        `scope_remap` policy fields. This shape mirrors the MCP `amp.import` tool
        signature byte-for-byte so an MXF document exported from one backend can be
        piped into another without an adapter layer regardless of which channel
        each side uses.

        Harness-only system API. SHOULD NOT be exposed to the LLM through the MCP adapter.
      operationId: importMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: |
            Import completed (synchronously or accepted for async processing). This
            status is returned for both fully successful imports and partial-success
            imports — row-level failures (malformed JSON lines, schema-invalid rows,
            scope violations under `scope_remap=strict`) are reported in
            `ImportResponse.failed` and `ImportResponse.errors`, not as HTTP 400.
            See spec §3.3.5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: |
            Request-level error only: the request body is unparseable or empty, the
            top-level `scope` field is missing/invalid, or the `ndjson` field is
            missing. Per-line NDJSON failures do NOT use this status — they are
            counted in `ImportResponse.failed`/`errors` with a `200` response. See
            spec §3.3.5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal backend error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: |
            Backend does not support bulk import, or does not support the requested
            `on_conflict` policy (typically `fail_atomic` on non-transactional
            backends). The `AmpErrorData.message` SHOULD identify which capability is
            unsupported so callers can downgrade (e.g. retry with `fail_fast`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Scope:
      type: object
      description: |
        Multi-dimensional partition keys (spec §2.3). At least one isolating
        identity key (`agent_id`, `group_id`, `workspace_id`, or `user_id`)
        MUST be set. The remaining keys (`session_id`, `app_id`, `org_id`)
        refine the namespace but do NOT satisfy the at-least-one-isolating-key
        requirement on their own.
      additionalProperties: false
      minProperties: 1
      properties:
        agent_id:
          type: string
          description: Logical identity of the agent.
        group_id:
          type: string
          description: Collaborative group or team identifier.
        workspace_id:
          type: string
          description: Shared workspace identifier.
        user_id:
          type: string
          description: End-user interacting with the agent.
        session_id:
          type: string
          description: Specific conversation turn, flow, or run (alias - run_id).
        app_id:
          type: string
          description: Product surface, app instance, or platform.
        org_id:
          type: string
          description: Tenant partition.
      anyOf:
        - required: [agent_id]
        - required: [group_id]
        - required: [workspace_id]
        - required: [user_id]

    ScopeEnvelope:
      description: |
        Request body shape carrying a `scope` object (preferred) or a legacy
        flat `agent_id` (for v1.0-compat callers). Used by REST endpoints
        whose only payload is the scope -- DELETE /v1/memories/{id} and
        PUT /v1/memories/{id}/pin.
      type: object
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy v1.0 flat identifier (mapped to scope.agent_id).

    MemoryResult:
      type: object
      required:
        - id
        - content
        - score
        - timestamp
        - status
        - scope
      properties:
        id:
          type: string
        content:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, pinned, archived]
        scope:
          $ref: '#/components/schemas/Scope'
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated in favor of multi-dimensional scoping in v1.1.
        metadata:
          type: object
          properties:
            amp.ttl:
              type: integer
            amp.confidence:
              type: number
              format: float
            amp.entities:
              type: array
              items:
                type: string
            amp.relations:
              type: array
              items:
                type: object
            amp.categories:
              type: array
              items:
                type: string
            amp.summary:
              type: string
          additionalProperties: true

    EncodeRequest:
      type: object
      additionalProperties: false
      required:
        - content
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        content:
          type: string
        source:
          type: string
        force:
          type: boolean
          default: false
        private:
          type: boolean
          default: false
          deprecated: true
          description: Deprecated in favor of multi-dimensional scoping.
        metadata:
          type: object
          additionalProperties: true

    EncodeResponse:
      type: object
      required:
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum: [stored, duplicate, below_threshold, queued]
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated. Echoed only when the legacy `private` param was supplied.
        event_id:
          type: string
          description: |
            Async processing reference. SHOULD be present when `status` is `queued`
            so callers can poll or subscribe to the eventual outcome.

    RecallRequest:
      type: object
      additionalProperties: false
      required:
        - query
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        query:
          type: string
        top_k:
          type: integer
          default: 10
        filters:
          $ref: '#/components/schemas/RecallFilters'

    RecallFilters:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [active, pinned, archived]
        visibility:
          type: string
          enum: [private, shared]
          deprecated: true
          description: Deprecated. Filter by visibility.
        source:
          type: string
        timestamp_after:
          type: string
          format: date-time
        timestamp_before:
          type: string
          format: date-time
        metadata_filters:
          type: array
          maxItems: 32
          description: |
            v1.2-draft. Structured predicates over the memory's metadata bag.
            All entries combined with strict AND — a memory MUST satisfy every
            filter to be returned. Backends MUST treat missing keys and
            mismatched value types as a filter miss (not a server error).
            See spec §3.2.2.1.
          items:
            $ref: '#/components/schemas/MetadataFilter'

    MetadataFilter:
      type: object
      description: |
        v1.2-draft. A single key-operator-value predicate over a memory's
        metadata bag. Used inside `RecallFilters.metadata_filters[]`. Keys are
        FLAT lookups against the stored metadata object — dotted strings like
        `amp.confidence` are literal keys, not path expressions.
      required: [key, operator, value]
      additionalProperties: false
      properties:
        key:
          type: string
          description: |
            Metadata key to evaluate. Reserved AMP keys like `amp.confidence`
            or `amp.categories` are addressable directly.
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, contains]
          description: |
            Comparison operator. Per-operator value type: eq/ne/gt/gte/lt/lte
            expect a scalar (string|number|boolean). `in` expects an array;
            the row matches when the stored value equals any element.
            `contains` expects a scalar; the row matches when the stored
            value (array OR string) contains that scalar. Any other operator
            string MUST be returned as `invalid_request`.
        value:
          description: |
            Comparison value. Scalar (string|number|boolean) for
            eq/ne/gt/gte/lt/lte/contains; array of scalars for `in`. `null`,
            nested arrays, and nested objects are rejected with
            `invalid_request`. JSON Schema cannot fully express the
            operator-dependent shape; backends MUST enforce the per-operator
            shape (see spec §3.2.2.1 "Error surface").
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                anyOf:
                  - type: string
                  - type: number
                  - type: boolean

    RecallResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResult'

    ConsolidateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for v1.0 compatibility (mapped to scope.agent_id).
        depth:
          type: string
          enum: [full, light]
          default: full

    ConsolidateResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [queued, ok, not_supported]
        memories_processed:
          type: integer

    StatsResponse:
      type: object
      required:
        - memory_count
      properties:
        memory_count:
          type: integer
        unconsolidated_count:
          type: integer
        metadata:
          type: object
          additionalProperties: true

    ErrorResponse:
      description: |
        Wire-compatible alias of the JSON Schema `AmpErrorData` definition
        (schema/amp.json). The field name `amp_error_code` matches the MCP
        channel exactly so the two channels share one error shape.
      type: object
      required:
        - amp_error_code
        - message
      properties:
        amp_error_code:
          type: string
          enum: [invalid_request, not_found, not_supported, backend_error]
        message:
          type: string

    ExportRequest:
      type: object
      description: Bulk export request. Scope and (optional) filters define which rows are emitted. Use `page_size` and `cursor` for pagination.
      additionalProperties: false
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat partition identifier (mapped to scope.agent_id).
        filters:
          $ref: '#/components/schemas/RecallFilters'
        page_size:
          type: integer
          minimum: 1
          description: |
            Hint for the maximum number of rows in this page. Backends MAY emit fewer rows
            under memory pressure but MUST NOT exceed the hint. If absent, the backend
            applies its own cap and uses `X-AMP-Next-Cursor` for continuation.
        cursor:
          type: string
          description: |
            Opaque continuation token returned by the prior page's `X-AMP-Next-Cursor`
            header. When omitted, the export starts from the beginning of the
            deterministic order.

    ImportRequest:
      type: object
      description: |
        Bulk import request. Mirrors the MCP `amp.import` tool input signature
        byte-for-byte so a single MXF document can move across either channel
        without an adapter. `ndjson` carries the inline MemoryResult lines; the
        structured `scope` and the `on_conflict` / `scope_remap` policy fields
        govern how the import is applied.
      additionalProperties: false
      required: [ndjson]
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat partition identifier (mapped to scope.agent_id).
        ndjson:
          type: string
          description: |
            MXF document (NDJSON). One `MemoryResult` per line. Each row MUST
            conform to the MemoryResult schema; rows that do not are counted in
            `ImportResponse.failed` rather than producing a 400.
        on_conflict:
          type: string
          enum: [skip, overwrite, fail_atomic, fail_fast]
          default: skip
          description: |
            Policy controlling what happens when a row cannot be cleanly imported.
            See spec §3.3.5 for the full contract. Backends that cannot honor
            `fail_atomic` (no transaction support) MUST return 501 `not_supported`
            with an `AmpErrorData.message` identifying the unsupported policy.
        scope_remap:
          type: string
          enum: [strict, inherit]
          default: strict
          description: |
            Policy when an imported row's own scope omits an identity key
            present in the request `scope`. `strict` (default) counts such
            rows as failed (`invalid_request`); `inherit` fills missing keys
            from the request scope. Callers MUST opt into `inherit` — it
            changes data ownership and is unsuitable for round-trip migration
            without explicit intent. Rows whose scope CONFLICTS with the
            request scope are always failed regardless of this policy.

    ImportResponse:
      type: object
      required:
        - imported
        - skipped
        - failed
      properties:
        imported:
          type: integer
          minimum: 0
          description: Rows successfully stored as new or overwritten.
        skipped:
          type: integer
          minimum: 0
          description: Rows skipped due to existing id conflict (only when on_conflict=skip).
        failed:
          type: integer
          minimum: 0
          description: Rows that failed validation or could not be stored.
        errors:
          type: array
          description: Bounded list of per-row failures. Backends MAY truncate.
          items:
            type: object
            required: [line, amp_error_code, message]
            properties:
              line:
                type: integer
                minimum: 1
              amp_error_code:
                type: string
                enum: [invalid_request, backend_error]
              message:
                type: string
        event_id:
          type: string
          description: Optional async processing reference if the backend executes the import asynchronously.

    ForgetResponse:
      type: object
      description: |
        Response shape for DELETE /v1/memories/{id} (amp.forget). `not_found`
        is returned here, not via HTTP 404, to match the MCP channel and to
        avoid cross-scope existence leaks (spec §3.2.3).
      required:
        - status
      properties:
        status:
          type: string
          enum: [forgotten, not_found]
          description: |
            `forgotten` — the memory existed under the active scope and was
            deleted. `not_found` — no memory with that `id` exists under the
            active scope (this is what a cross-scope id returns too; the
            backend MUST NOT distinguish "wrong scope" from "doesn't exist").

    PinResponse:
      type: object
      description: |
        Response shape for PUT /v1/memories/{id}/pin (amp.pin). `not_found`
        and `not_supported` are returned here as success body statuses to
        match the MCP channel. The path's `501` response remains available
        for backends that prefer the HTTP-status route for `not_supported`,
        but `not_found` MUST come back as 200 + body status (existence-leak
        discipline).
      required:
        - status
      properties:
        status:
          type: string
          enum: [pinned, not_found, not_supported]
          description: |
            `pinned` — memory is marked permanent. `not_found` — no memory
            with that `id` under the active scope (existence-leak
            discipline). `not_supported` — backend does not implement
            pinning.

    UpdateRequest:
      type: object
      description: |
        v1.2-draft. Body for PATCH /v1/memories/{id} (amp.update). At least
        one isolating identity key must be supplied via `scope` (preferred) or
        legacy `agent_id`. Omit `content` and `metadata` to make a no-op call
        (returns `status: "no_change"`); supply one or both to mutate. See
        spec §3.2.4.
      additionalProperties: false
      anyOf:
        - required: [scope]
        - required: [agent_id]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy v1.0 flat identifier (mapped to scope.agent_id).
        content:
          type: string
          minLength: 1
          description: |
            New content for the memory. Omit to leave unchanged. An empty
            string is rejected with `invalid_request` (use `amp.forget` to
            delete a row).
        metadata:
          type: object
          additionalProperties: true
          description: |
            Patch applied to the existing metadata bag. Default semantics are
            RFC 7396 JSON Merge Patch (keys absent from the patch are
            preserved; `null` in the patch removes the key). Set
            `metadata_mode: "replace"` to overwrite the bag wholesale. The
            post-merge bag is bounded by the 64 KiB serialized JSON cap; a
            request that would land an oversized bag is rejected as
            `invalid_request` BEFORE the durable write.
        metadata_mode:
          type: string
          enum: [merge, replace]
          default: merge
          description: |
            `merge` (default, RFC 7396) — patch into the existing metadata
            bag. `replace` — overwrite the bag wholesale with the request's
            `metadata` value. Backends MUST NOT default to `replace`.

    UpdateResponse:
      type: object
      description: |
        v1.2-draft. Response shape for PATCH /v1/memories/{id} (amp.update).
        `id` is echoed so pipelined callers can correlate by index.
      required:
        - status
      properties:
        id:
          type: string
          description: |
            The memory id that was updated. Echoes the path parameter on
            success (`updated`/`no_change`) and is omitted on `not_found` /
            `not_supported`.
        status:
          type: string
          enum: [updated, no_change, not_found, not_supported]
          description: |
            `updated` — the memory was mutated. `no_change` — the request was
            well-formed but produced no observable change. `not_found` — no
            memory with that `id` exists under the active scope
            (existence-leak discipline; matches `amp.forget`). `not_supported`
            — backend does not implement mutation.

    BatchEncodeRequest:
      type: object
      description: |
        v1.2-draft. Body for POST /v1/memories/batch_encode. Shared `scope`
        applies to every row; entries do NOT carry their own scope. See spec
        §3.2.5.
      additionalProperties: false
      anyOf:
        - required: [scope]
        - required: [agent_id]
      required:
        - entries
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy v1.0 flat identifier (mapped to scope.agent_id).
        entries:
          type: array
          minItems: 0
          maxItems: 1000
          description: |
            Per-row encode entries. Each row is the same shape as `amp.encode`
            input minus the scope keys. An empty array is well-formed and
            yields an empty `results[]` (`minItems: 0` matches the canonical
            schema). Backends MAY enforce a lower `maxItems` cap; over-limit
            requests are rejected with `invalid_request`.
          items:
            $ref: '#/components/schemas/BatchEncodeEntry'

    BatchEncodeEntry:
      type: object
      description: |
        v1.2-draft. A single row in `BatchEncodeRequest.entries[]`. Forbidden
        keys (`scope`, `agent_id`, `private`) are explicitly rejected with
        row-level `invalid_request` rather than silently dropped, so clients
        can't think the value was honoured.
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: Memory content. Empty/whitespace strings are row-level invalid_request.
        source:
          type: string
          description: |
            Provenance label. Must match a member of the published
            `MemorySource` enum; an unrecognised string is row-level
            `invalid_request` (no silent fall-back).
        force:
          type: boolean
          default: false
          description: |
            Bypass the salience gate. Strict bool only — truthy coercion
            (`"true"`, `1`, `[]`) is row-level `invalid_request`.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Optional metadata bag for this row. 64 KiB serialized JSON cap
            applies per-row; oversized bags are row-level `invalid_request`.

    BatchEncodeRowResult:
      type: object
      description: |
        v1.2-draft. A single row in `BatchEncodeResponse.results[]`.
        Ordering invariant: `results[i]` corresponds to `entries[i]` for every
        `i`.
      required:
        - status
      properties:
        id:
          type: string
          description: Memory id allocated for this row. Present when status is `stored` or `duplicate`.
        status:
          type: string
          enum: [stored, duplicate, below_threshold, queued, invalid_request, backend_error]
          description: |
            Per-row outcome. `stored` — new id allocated. `duplicate` —
            content already present under the scope. `below_threshold` —
            salience gate rejected the row. `queued` — async ingestion
            accepted; `id` may be deferred. `invalid_request` — row was
            malformed. `backend_error` — backend failed to write THIS row
            (other rows are unaffected). The latter two MUST also carry
            `message`.
        message:
          type: string
          description: Diagnostic. Required on `invalid_request` / `backend_error`.

    BatchSummary:
      type: object
      description: |
        v1.2-draft. Aggregated counts across the batch. Backends MUST emit
        `summary` whenever `results[]` has at least one row.
      required:
        - stored
        - below_threshold
        - duplicate
        - failed
      properties:
        stored:
          type: integer
          minimum: 0
        below_threshold:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0

    BatchEncodeResponse:
      type: object
      description: |
        v1.2-draft. Response shape for POST /v1/memories/batch_encode. The
        canonical JSON-Schema requires only `results`; `summary` is emitted
        by backends whenever `results[]` has at least one row (per spec
        §3.2.5 "Summary block") but is not part of the strict required-set so
        a backend returning an empty batch may legitimately omit it.
      required:
        - results
      properties:
        results:
          type: array
          description: |
            One outcome per input row, in the same order as the input
            `entries[]`. `len(results) == len(entries)`.
          items:
            $ref: '#/components/schemas/BatchEncodeRowResult'
        summary:
          $ref: '#/components/schemas/BatchSummary'

    ExportResponse:
      description: |
        Body shape of the NDJSON stream emitted by POST /v1/memories/export.
        NDJSON (`application/x-ndjson`) is line-delimited JSON, NOT a single
        JSON array: each line is an independently parseable JSON object
        conforming to `MemoryResult`. Modelled as `type: string` because the
        OpenAPI body schema describes the byte stream — readers MUST split
        on `\n` and parse each non-empty line as a `MemoryResult`. See spec
        Appendix A for the MXF row schema and consumer guidance.

        Continuation across pages travels in the `X-AMP-Next-Cursor` response
        header (see the endpoint's 200 response). The body itself does not
        carry a cursor envelope.
      type: string
