openapi: 3.0.0
info:
  title: Agent Memory Protocol (AMP) v1.1 REST API Specification
  description: |
    Standard RESTful service contract for the Agent Memory Protocol (AMP) v1.1.
    This specification enables application harnesses to integrate with memory backends
    as a robust service layer, independent of the Model Context Protocol (MCP) transport.
  version: 1.1.0
servers:
  - url: http://localhost:8000
    description: Local development memory backend server
paths:
  /v1/memories:
    post:
      summary: Encode a new memory (amp.encode)
      description: |
        Ingest a new memory for a given logical agent, scoped to a specific user,
        session, application surface, or organization if applicable. The backend
        evaluates the salience of the memory unless `force` is set to `true`.
        Asynchronous backends may queue this extraction and return `status: queued`.
      operationId: encodeMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncodeRequest'
      responses:
        '200':
          description: Ingestion processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
        '400':
          description: Invalid Request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Backend Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/recall:
    post:
      summary: Recall memories (amp.recall)
      description: Retrieve active or pinned memories relevant to a query.
      operationId: recallMemories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallRequest'
      responses:
        '200':
          description: Retrieved matching memories ranked by relevance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/memories/{id}:
    delete:
      summary: Forget a memory (amp.forget)
      description: Permanently delete a memory from the store, cascading to all index models and graphs.
      operationId: forgetMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
        - name: agent_id
          in: query
          required: false
          description: Optional partition key of the agent owning this memory
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          description: Optional partition key of the group owning this memory
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          description: Optional partition key of the workspace owning this memory
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Optional partition key of the user owning this memory
          schema:
            type: string
        - name: app_id
          in: query
          required: false
          description: Optional app or platform surface partition key
          schema:
            type: string
      responses:
        '200':
          description: Deletion request outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [forgotten, not_found]
        '400':
          description: Missing query parameter

  /v1/memories/{id}/pin:
    put:
      summary: Pin a memory (amp.pin)
      description: Mark a memory as permanent so that background consolidation will never archive it.
      operationId: pinMemory
      parameters:
        - name: id
          in: path
          required: true
          description: Globally unique identifier of the memory
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  description: The logical identity of the agent.
                group_id:
                  type: string
                  description: Optional collaborative group identifier.
                workspace_id:
                  type: string
                  description: Optional shared workspace identifier.
                user_id:
                  type: string
                  description: Optional user scope partition.
                app_id:
                  type: string
                  description: Optional app or platform surface partition.
      responses:
        '200':
          description: Pin request outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [pinned, not_found]

  /v1/memories/consolidate:
    post:
      summary: Consolidate memory (amp.consolidate)
      description: |
        Trigger background consolidation, summarizing, decaying, and archiving memories.
        This is a harness-only system API and should be scheduled out-of-band by cron loops.
      operationId: consolidateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidateRequest'
      responses:
        '200':
          description: Consolidation triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateResponse'

  /v1/memories/stats:
    get:
      summary: Retrieve statistics (amp.stats)
      description: Fetch metrics, record counts, and engine states for a specific namespace.
      operationId: statsMemory
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
        - name: group_id
          in: query
          required: false
          schema:
            type: string
        - name: workspace_id
          in: query
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          schema:
            type: string
        - name: app_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Statistics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

components:
  schemas:
    Scope:
      type: object
      properties:
        agent_id:
          type: string
          description: Logical identity of the agent.
        group_id:
          type: string
          description: Collaborative group or team identifier.
        workspace_id:
          type: string
          description: Shared workspace identifier.
        user_id:
          type: string
          description: Optional end-user interacting with the agent.
        session_id:
          type: string
          description: Optional specific conversation turn or session.
        app_id:
          type: string
          description: Optional product surface or app surface.
        org_id:
          type: string
          description: Optional tenant partition.

    MemoryResult:
      type: object
      required:
        - id
        - content
        - score
        - timestamp
        - status
        - scope
      properties:
        id:
          type: string
        content:
          type: string
        score:
          type: number
          format: float
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, pinned, archived]
        scope:
          $ref: '#/components/schemas/Scope'
        metadata:
          type: object
          properties:
            amp.ttl:
              type: integer
            amp.confidence:
              type: number
              format: float
            amp.entities:
              type: array
              items:
                type: string
            amp.relations:
              type: array
              items:
                type: object
            amp.categories:
              type: array
              items:
                type: string
            amp.summary:
              type: string
          additionalProperties: true

    EncodeRequest:
      type: object
      required:
        - content
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for fallback.
        content:
          type: string
        source:
          type: string
        force:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    EncodeResponse:
      type: object
      required:
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum: [stored, duplicate, below_threshold, queued]
        event_id:
          type: string
          description: Optional async transaction or processing event reference for status='queued'.

    RecallRequest:
      type: object
      required:
        - query
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for fallback.
        query:
          type: string
        top_k:
          type: integer
          default: 10
        filters:
          type: object
          properties:
            status:
              type: string
              enum: [active, pinned, archived]
            source:
              type: string
            timestamp_after:
              type: string
              format: date-time
            timestamp_before:
              type: string
              format: date-time

    RecallResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResult'

    ConsolidateRequest:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        agent_id:
          type: string
          description: Legacy flat identifier for fallback.
        depth:
          type: string
          enum: [full, light]
          default: full

    ConsolidateResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [queued, ok, not_supported]
        memories_processed:
          type: integer

    StatsResponse:
      type: object
      required:
        - memory_count
      properties:
        memory_count:
          type: integer
        unconsolidated_count:
          type: integer
        metadata:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, not_supported, backend_error]
        message:
          type: string
