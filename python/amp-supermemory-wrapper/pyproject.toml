[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amp-supermemory-wrapper"
version = "1.0.0"
description = "AMP (Agent Memory Protocol) wrapper for SuperMemory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0",
    "requests>=2.20.0",
]

[project.scripts]
amp-supermemory-wrapper = "amp_supermemory_wrapper.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_supermemory_wrapper"]
