[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amp-mem0-rest-wrapper"
version = "1.0.0"
description = "AMP (Agent Memory Protocol) REST API wrapper for Mem0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyyaml>=6.0",
    "requests>=2.20.0",
    "pydantic>=2.0",
    "mem0ai>=0.1.0",
]

[project.scripts]
amp-mem0-rest-wrapper = "amp_mem0_rest_wrapper.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_mem0_rest_wrapper"]
