[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amp-server"
version = "1.0.0"
description = "AMP (Agent Memory Protocol) reference server — smriti-memcore backend over MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0",
    "smriti-memcore>=1.2.1",
]

[project.scripts]
amp-server = "amp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_server"]
